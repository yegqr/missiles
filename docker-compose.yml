services:
  db:
    image: postgres:16-alpine
    container_name: missiles-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-missiles}
      POSTGRES_USER: ${POSTGRES_USER:-missiles}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-missiles}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5543}:5432"
    volumes:
      - missiles_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-missiles} -d ${POSTGRES_DB:-missiles}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  missiles_pgdata:
